name: medical-ai-platform

services:
  mysql:
    image: mysql:8.4
    container_name: medical-ai-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-medical_ai_root_dev}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-medical_ai}"
      MYSQL_USER: "${MYSQL_USER:-medical_ai}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-medical_ai_dev_password}"
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:
